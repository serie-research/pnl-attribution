<div class="w-i4">
<p class="example"></p>
<svg class="venn-map" role="group" aria-label="Venn diagram of a P&amp;L and two overlapping indicators, volatility and spread; the part of their overlap that is also about the P&amp;L is hatched as shared information. Beside it, four games that can value a subset of indicators. Each card gives the formula of the game, the question it answers, its unit and the shares of volatility and spread in one synthetic example. The diagram links to section 4.1, each game to section 4.2."></svg>
<p class="detail" aria-live="polite"></p>
</div>
<style>
[data-embed] .w-i4 { padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--page-bg); color: var(--text-color); font: 14px/1.5 var(--default-font-family, sans-serif);
  --ink: var(--text-color); --w-surface: #f5f5f5; --w-one: var(--info-color); --w-two: var(--primary-color); }
[data-theme="dark"] [data-embed] .w-i4 { --w-surface: #1f232b; --w-one: color-mix(in srgb, var(--info-color) 75%, white); --w-two: color-mix(in srgb, var(--primary-color) 85%, white); }
[data-embed] .w-i4 svg { display: block; width: 100%; height: auto; overflow: visible; }
[data-embed] .w-i4 svg text { font-family: var(--default-font-family, sans-serif); fill: var(--ink); white-space: pre; }
[data-embed] .w-i4 .muted text, [data-embed] .w-i4 text.muted { fill: var(--muted-color); }
[data-embed] .w-i4 text.one { fill: var(--w-one); } [data-embed] .w-i4 text.two { fill: var(--w-two); }
[data-embed] .w-i4 .outcome-fill { fill: var(--w-surface); }
[data-embed] .w-i4 .one-fill { fill: var(--w-one); fill-opacity: .22; } [data-embed] .w-i4 .two-fill { fill: var(--w-two); fill-opacity: .22; }
[data-embed] .w-i4 .outcome-line { fill: none; stroke: var(--muted-color); stroke-width: 1px; transition: stroke-width .15s; }
[data-embed] .w-i4 .one-line { fill: none; stroke: var(--w-one); stroke-width: 1.4px; } [data-embed] .w-i4 .two-line { fill: none; stroke: var(--w-two); stroke-width: 1.4px; }
[data-embed] .w-i4 .hatch-line { stroke: var(--ink); stroke-width: .9px; }
[data-embed] .w-i4 .leader { stroke: var(--ink); stroke-width: 1px; }
[data-embed] .w-i4 .game rect.card { fill: var(--page-bg); stroke: var(--border-color); stroke-width: 1px; }
[data-embed] .w-i4 a { cursor: pointer; } [data-embed] .w-i4 a:focus { outline: none; }
[data-embed] .w-i4 .hit { fill: transparent; }
[data-embed] .w-i4 a.venn:hover .hit, [data-embed] .w-i4 a.venn:focus-visible .hit { fill: color-mix(in srgb, var(--w-one) 7%, transparent); }
[data-embed] .w-i4 a.venn:focus-visible .hit { stroke: var(--w-one); stroke-width: 1.5px; }
[data-embed] .w-i4 a.venn:hover .rule text, [data-embed] .w-i4 a.venn:focus-visible .rule text,
[data-embed] .w-i4 a.game:hover .gtitle text, [data-embed] .w-i4 a.game:focus-visible .gtitle text { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
[data-embed] .w-i4 .arrow { stroke: var(--ink); stroke-width: 1.3px; }
[data-embed] .w-i4 a.game { transition: opacity .15s; }
[data-embed] .w-i4 svg.focus a.game:not(.on) { opacity: .4; }
[data-embed] .w-i4 a.game.on rect.card { stroke: var(--ink); stroke-width: 1.8px; }
[data-embed] .w-i4 svg.focus .outcome-line { stroke: var(--ink); stroke-width: 1.8px; }
[data-embed] .w-i4 .example { margin: 0 2px 10px; font-size: 14px; line-height: 1.45; color: var(--muted-color); }
[data-embed] .w-i4 .track { fill: none; stroke: var(--border-color); stroke-width: 1px; }
[data-embed] .w-i4 .zero { stroke: var(--muted-color); stroke-width: 1px; }
[data-embed] .w-i4 .full { stroke: var(--muted-color); stroke-width: 1px; stroke-dasharray: 2 3; }
[data-embed] .w-i4 .bar-one { fill: var(--w-one); fill-opacity: .8; } [data-embed] .w-i4 .bar-two { fill: var(--w-two); fill-opacity: .8; }
[data-embed] .w-i4 .detail { min-height: 3em; margin: 10px 2px 0; font-size: 14px; line-height: 1.45; color: var(--muted-color); }
[data-embed] .w-i4 .detail b { color: var(--text-color); }
[data-embed] .w-i4 sub, [data-embed] .w-i4 sup { font-size: .72em; line-height: 0; }
</style>
<script>
(() => {
  const root = document.currentScript.closest('[data-embed]');
  const box = root.querySelector('.w-i4');
  const svgEl = box.querySelector('svg');
  const detail = box.querySelector('.detail');
  const uid = 'w-i4-' + Math.random().toString(36).slice(2, 8);

  // Rich SVG text with wrapping. Markup: **bold**, *italic*, _{sub}, ^{sup}, !{overline}, \n = line break.
  const ctx = document.createElement('canvas').getContext('2d');
  const family = () => getComputedStyle(svgEl).fontFamily || 'sans-serif';
  function parse(str, bold) {
    const out = []; let b = !!bold, i = false, buf = '', k = 0;
    const push = (t, s = 0, o = false) => { if (t) out.push({ t, b, i, s, o }); };
    while (k < str.length) {
      if (str.startsWith('**', k)) { push(buf); buf = ''; b = !b; k += 2; }
      else if (str[k] === '*') { push(buf); buf = ''; i = !i; k++; }
      else if (str[k] === '!' && str[k + 1] === '{') { push(buf); buf = ''; const end = str.indexOf('}', k); push(str.slice(k + 2, end), 0, true); k = end + 1; }
      else if ((str[k] === '_' || str[k] === '^') && str[k + 1] === '{') {
        push(buf); buf = ''; const end = str.indexOf('}', k);
        push(str.slice(k + 2, end), str[k] === '_' ? 1 : -1); k = end + 1;
      } else { buf += str[k]; k++; }
    }
    push(buf); return out;
  }
  const fontOf = (r, size) => `${r.i ? 'italic ' : ''}${r.b ? 600 : 400} ${r.s ? size * 0.72 : size}px ${family()}`;
  const measure = (r, size) => { ctx.font = fontOf(r, size); return ctx.measureText(r.t).width; };
  function words(str, size, bold) {
    const ws = [[]];
    // A word may also break after a hyphen, a dash or a slash; the pieces are glued (no space).
    for (const r of parse(str, bold)) r.t.split(' ').forEach((p, j) => {
      if (j) ws.push([]);
      p.split(/(?<=[-–\/])(?=.)/).forEach((q, k) => { if (k) { ws.push([]); ws.at(-1).glue = true; } if (q) ws.at(-1).push({ ...r, t: q }); });
    });
    return ws.filter(w => w.length).map(runs => {
      let width = 0;
      runs.forEach((r, j) => {
        r.w = measure(r, size);
        const prev = runs[j - 1];
        if (r.s === -1 && prev && prev.s === 1) { r.dx = -prev.w; width += Math.max(0, r.w - prev.w); r.after = Math.max(0, prev.w - r.w); }
        else width += r.w;
      });
      return { runs, width, glue: !!runs.glue };
    });
  }
  function layout(str, maxW, size, bold) {
    const lines = [];
    for (const para of String(str).split('\n')) {
      let line = null;
      const space = measure({ t: ' ', b: false, i: false, s: 0 }, size);
      // Glued pieces (a word split after a hyphen) break apart only when the whole word cannot fit on a line.
      const chains = [];
      for (const w of words(para, size, bold)) { if (w.glue && chains.length) chains.at(-1).push(w); else chains.push([w]); }
      const add = w => {
        const sp = w.glue ? 0 : space;
        if (line && line.width + sp + w.width <= maxW) { line.words.push(w); line.width += sp + w.width; }
        else { line = { words: [w], width: w.width }; lines.push(line); }
      };
      for (const chain of chains) {
        const cw = d3.sum(chain, w => w.width);
        if (chain.length > 1 && cw <= maxW && line && line.width + space + cw > maxW) line = null;
        if (chain.length > 1 && cw <= maxW) {
          if (line) { line.words.push(...chain); line.width += space + cw; } else { line = { words: chain, width: cw }; lines.push(line); }
        } else chain.forEach(add);
      }
    }
    return { lines, width: d3.max(lines, l => l.width) || 0 };
  }
  function draw(parent, str, { x, y, w = 1e4, size = 13, lh = size * 1.28, anchor = 'start', bold = false, fill = null, cls = '' }) {
    const lay = layout(str, w, size, bold);
    lay.lines.forEach((line, n) => {
      const x0 = anchor === 'middle' ? x - line.width / 2 : anchor === 'end' ? x - line.width : x;
      const text = parent.append('text').attr('x', x0).attr('y', y + n * lh + size * 0.9).attr('class', cls).style('font-size', size + 'px');
      if (fill) text.style('fill', fill);
      let cur = 0, pending = 0; const bars = [];
      line.words.forEach((word, j) => {
        word.runs.forEach((r, m) => {
          const target = r.s === 1 ? size * 0.24 : r.s === -1 ? -size * 0.4 : 0;
          const t = text.append('tspan').text((j && !m && !word.glue ? ' ' : '') + r.t).attr('dy', target - cur);
          cur = target;
          if (r.b) t.style('font-weight', 600); if (r.i) t.style('font-style', 'italic');
          if (r.s) t.style('font-size', size * 0.72 + 'px');
          if (r.o) bars.push([t.node(), size]);
          if (r.dx) t.attr('dx', r.dx); else if (pending) t.attr('dx', pending);
          pending = r.after || 0;
        });
      });
      for (const [node, sz] of bars) {
        try {
          const k = node.getNumberOfChars() - 1, a = node.getStartPositionOfChar(k), b = node.getEndPositionOfChar(k);
          parent.append('line').attr('x1', a.x + sz * 0.12).attr('x2', b.x + sz * 0.08).attr('y1', a.y - sz * 0.8).attr('y2', a.y - sz * 0.8)
            .style('stroke', 'var(--ink)').attr('stroke-width', 0.9);
        } catch { /* not rendered yet */ }
      }
    });
    return { height: lay.lines.length ? (lay.lines.length - 1) * lh + size * 1.2 : 0, width: lay.width };
  }

  const textH = (str, w, size, bold) => { const n = layout(str, w, size, bold).lines.length; return n ? (n - 1) * size * 1.28 + size * 1.2 : 0; };
  const plain = s => s.replace(/\*|_\{|\^\{|\}/g, '').replace(/\n/g, ' ');
  const toHTML = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/_\{(.+?)\}/g, '<sub>$1</sub>').replace(/\^\{(.+?)\}/g, '<sup>$1</sup>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  let data = null, active = null, linkBase = '', refs = {};
  // In the article each link jumps to its heading; on any other page it opens the article there.
  const href = id => document.getElementById(id) ? `#${id}` : `${linkBase}attribution/#${id}`;
  const idle = 'Hover over or focus a game to see how its value is computed, with the numbers of the example. The diagram links to section 4.1, each game to section 4.2.';

  function render() {
    if (!data) return;
    const W = svgEl.clientWidth || 400, wide = W >= 600;
    const svg = d3.select(svgEl); svg.selectAll('*').remove();
    const defs = svg.append('defs');
    defs.append('marker').attr('id', `${uid}-arrow`).attr('viewBox', '0 0 10 10').attr('refX', 9.5).attr('refY', 5).attr('markerWidth', 8).attr('markerHeight', 8)
      .attr('markerUnits', 'userSpaceOnUse').attr('orient', 'auto').append('path').attr('d', 'M0,0 L10,5 L0,10 L2.5,5 z').style('fill', 'var(--ink)');
    defs.append('pattern').attr('id', `${uid}-hatch`).attr('patternUnits', 'userSpaceOnUse').attr('width', 5).attr('height', 5).attr('patternTransform', 'rotate(45)')
      .append('line').attr('class', 'hatch-line').attr('x1', 2.5).attr('x2', 2.5).attr('y1', 0).attr('y2', 5);
    // Sizes: labels, card titles, card text.
    const fl = wide ? 12.5 : 13, ft = 14, fb = wide ? 12.5 : 13;
    const v = data.venn, s = 1.35;
    // The Venn diagram keeps the TikZ geometry (points, y up), scaled by s.
    const w1 = layout(v.one, 1e4, fl).width, w2 = layout(v.two, 1e4, fl).width, wsh = layout(v.shared, 1e4, fl).width;
    const left = Math.max(60 * s, 34 * s + w1) + 2, right = Math.max(60 * s, 56 * s + 5 + wsh, 34 * s + w2) + 2;
    const vc = wide ? left : Math.min(Math.max(W / 2, left), W - right);
    const vy = (wide ? 18 : 6) + 66 * s;
    const X = x => vc + x * s, Y = y => vy - y * s;
    const venn = svg.append('a').attr('class', 'venn').attr('href', href(v.id)).attr('aria-label', `Shared information, section ${v.sec}: ${plain(v.rule)}`);
    const hit = venn.append('rect').attr('class', 'hit').attr('rx', 8);
    const circles = { y: [0, 26, 40], a: [-24, -12, 36], b: [24, -12, 36] };
    const circle = (g, k, cls) => g.append('circle').attr('class', cls).attr('cx', X(circles[k][0])).attr('cy', Y(circles[k][1])).attr('r', circles[k][2] * s);
    for (const k of Object.keys(circles)) circle(defs.append('clipPath').attr('id', `${uid}-clip-${k}`), k, '');
    circle(venn, 'y', 'outcome-fill'); circle(venn, 'a', 'one-fill'); circle(venn, 'b', 'two-fill');
    // Shared information: the part of the overlap of both indicators that lies inside the outcome.
    venn.append('g').attr('clip-path', `url(#${uid}-clip-y)`).append('g').attr('clip-path', `url(#${uid}-clip-a)`).append('g').attr('clip-path', `url(#${uid}-clip-b)`)
      .append('rect').attr('x', X(-60)).attr('y', Y(80)).attr('width', 120 * s).attr('height', 140 * s).style('fill', `url(#${uid}-hatch)`);
    circle(venn, 'y', 'outcome-line'); circle(venn, 'a', 'one-line'); circle(venn, 'b', 'two-line');
    refs.olabel = venn.append('g'); refs.ox = X(0); refs.oy = Y; refs.fl = fl;
    draw(venn, v.one, { x: X(-34), y: Y(-46), size: fl, anchor: 'end', cls: 'one' });
    draw(venn, v.two, { x: X(34), y: Y(-46), size: fl, cls: 'two' });
    venn.append('line').attr('class', 'leader').attr('x1', X(0)).attr('y1', Y(8)).attr('x2', X(56)).attr('y2', Y(40));
    draw(venn, v.shared, { x: X(56) + 5, y: Y(40) - textH(v.shared, 1e4, fl) / 2, size: fl });
    const rw = Math.min(150 * s, W), ry = Y(-66), rh = textH(v.rule, rw, fb);
    draw(venn.append('g').attr('class', 'rule'), v.rule, { x: vc, y: ry, w: rw, size: fb, anchor: 'middle' });
    const x0 = Math.max(-4, Math.min(vc - left, vc - rw / 2) - 6), x1 = Math.max(vc + right, vc + rw / 2) + 6;
    hit.attr('x', x0).attr('y', Y(66) - 6).attr('width', x1 - x0).attr('height', ry + rh + 6 - (Y(66) - 6));

    // The games: one card each, all linking to 4.2. A card has a formula, a question, a unit and two bars.
    const gx = wide ? vc + right + 30 : 0, gw = W - gx;
    let gy = wide ? 0 : ry + rh + 24;
    gy += draw(svg.append('g'), `**${data.title}**`, { x: gx, y: gy, w: gw, size: ft }).height + 4;
    gy += draw(svg.append('g').attr('class', 'muted'), data.axis, { x: gx, y: gy, w: gw, size: fb }).height + 8;
    const names = [[v.one, 'one'], [v.two, 'two']];
    const lw = d3.max(names, n => layout(n[0], 1e4, fb).width) + 8;
    const vw = d3.max(data.games, d => d3.max(d.shares, q => layout(q.text, 1e4, fb).width)) + 4;
    const tx0 = gx + 9 + lw, tx1 = gx + gw - 9 - vw - 6, [lo, hi] = data.axisRange;
    const bx = u => tx0 + (u - lo) / (hi - lo) * (tx1 - tx0), rowH = Math.max(20, fb * 1.6);
    refs.cards = {};
    for (const d of data.games) {
      const a = svg.append('a').attr('class', 'game').attr('data-key', d.key).attr('href', href(data.id))
        .attr('aria-label', `${plain(d.title)}, section ${data.sec}: ${d.formula ? plain(d.formula) + '. ' : ''}${plain(d.question)} ${plain(d.unit)} ${d.shares.map((q, i) => `${plain(names[i][0])} ${q.text}`).join(', ')}`);
      const rect = a.append('rect').attr('class', 'card').attr('x', gx + 0.5).attr('y', gy).attr('width', gw - 1).attr('rx', 5);
      let y = gy + 7;
      y += draw(a.append('g').attr('class', 'gtitle'), `**${d.title}**`, { x: gx + 9, y, w: gw - 18, size: ft }).height + 3;
      if (d.formula) y += draw(a.append('g').attr('class', 'formula'), d.formula, { x: gx + 9, y, w: gw - 18, size: fb }).height + 4;
      y += draw(a, d.question, { x: gx + 9, y, w: gw - 18, size: fb }).height + 3;
      y += draw(a, d.unit, { x: gx + 9, y, w: gw - 18, size: fb, cls: 'muted' }).height + 7;
      const top = y;
      d.shares.forEach((q, i) => {
        const ry0 = top + i * rowH, mid = ry0 + rowH / 2;
        draw(a, names[i][0], { x: gx + 9, y: mid - fb * 0.6, size: fb, cls: names[i][1] });
        a.append('rect').attr('class', `bar-${names[i][1]}`).attr('x', bx(Math.min(0, q.value))).attr('y', ry0 + 3).attr('width', Math.abs(bx(q.value) - bx(0))).attr('height', rowH - 6).attr('rx', 2);
        draw(a, q.text, { x: gx + gw - 9 - vw, y: mid - fb * 0.6, size: fb });
      });
      y = top + 2 * rowH;
      a.append('line').attr('class', 'zero').attr('x1', bx(0)).attr('x2', bx(0)).attr('y1', top).attr('y2', y);
      a.append('line').attr('class', 'full').attr('x1', bx(1)).attr('x2', bx(1)).attr('y1', top).attr('y2', y);
      const h = y + 8 - gy;
      rect.attr('height', h);
      refs.cards[d.key] = { y: gy, h };
      gy += h + 6;
    }
    gy += draw(svg.append('g'), data.note, { x: gx, y: gy + 1, w: gw, size: fb }).height + 1;
    refs.arrow = wide ? svg.append('line').attr('class', 'arrow').attr('x1', X(64)).attr('y1', Y(-10)).attr('x2', gx - 4).attr('marker-end', `url(#${uid}-arrow)`) : null;
    const H = Math.max(ry + rh + 7, gy + 2);
    svg.attr('viewBox', `0 0 ${W} ${Math.ceil(H)}`).attr('height', Math.ceil(H));
    svg.selectAll('a.game').on('mouseenter focus', function () { setActive(this.dataset.key); }).on('mouseleave blur', () => setActive(null));
    paint();
  }

  // The active game names what the outcome circle stands for, and the arrow points at it; no redraw.
  function paint() {
    const g = active && data.games.find(d => d.key === active);
    const svg = d3.select(svgEl).classed('focus', !!g);
    svg.selectAll('a.game').classed('on', function () { return g && this.dataset.key === g.key; });
    refs.olabel.selectAll('*').remove();
    const label = g ? g.outcome : data.venn.outcome, two = label.includes('\n');
    draw(refs.olabel, label, { x: refs.ox, y: two ? refs.oy(54) : refs.oy(54) - refs.fl * 0.6, size: refs.fl, anchor: 'middle', cls: g ? '' : 'muted' });
    // At rest the arrow points at the second game, as in the TikZ figure.
    if (refs.arrow) { const c = refs.cards[g ? g.key : data.games[1].key]; refs.arrow.attr('y2', c.y + c.h / 2); }
  }

  function setActive(key) {
    if (key === active) return;
    active = key;
    paint();
    const g = active && data.games.find(d => d.key === active);
    detail.innerHTML = g ? `<b>${toHTML(g.title)}</b> (${data.sec}). ${toHTML(g.detail)}` : idle;
    box.dataset.active = active || '';
  }

  linkBase = root.dataset.url.replace(/data\/[^/]*$/, '');
  d3.json(root.dataset.url).then(d => {
    data = d; detail.textContent = idle; box.querySelector('.example').innerHTML = toHTML(d.example);
    new ResizeObserver(() => render()).observe(svgEl);
    render(); box.dataset.ready = 'true';
  }).catch(error => { detail.textContent = `Could not load figure: ${error.message}`; });
})();
</script>
