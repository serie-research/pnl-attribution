<div class="w-i0">
<svg class="route" role="group" aria-label="Route of the page: from the desk's question, through sections 1 to 5, to explaining a P&L. Each numbered station links to its section."></svg>
</div>
<style>
[data-embed] .w-i0 { padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--page-bg); color: var(--text-color); font: 14px/1.5 var(--default-font-family, sans-serif);
  --ink: var(--text-color); --w-box: #f5f5f5; --w-thread: var(--info-color); --w-current: var(--primary-color); }
[data-theme="dark"] [data-embed] .w-i0 { --w-box: #1f232b; --w-thread: color-mix(in srgb, var(--info-color) 80%, white); }
[data-embed] .w-i0 svg { display: block; width: 100%; height: auto; overflow: visible; }
[data-embed] .w-i0 svg text { font-family: var(--default-font-family, sans-serif); fill: var(--ink); white-space: pre; }
[data-embed] .w-i0 .muted text, [data-embed] .w-i0 text.muted { fill: var(--muted-color); }
[data-embed] .w-i0 a { cursor: pointer; }
[data-embed] .w-i0 a:focus { outline: none; }
[data-embed] .w-i0 .hit { fill: transparent; }
[data-embed] .w-i0 a:hover .hit, [data-embed] .w-i0 a:focus-visible .hit { fill: color-mix(in srgb, var(--w-thread) 10%, transparent); }
[data-embed] .w-i0 a:focus-visible .hit { stroke: var(--w-thread); stroke-width: 1.5px; }
[data-embed] .w-i0 a:hover .title text, [data-embed] .w-i0 a:focus-visible .title text { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
[data-embed] .w-i0 .dot { fill: var(--w-thread); transition: fill .2s, r .2s; }
[data-embed] .w-i0 .num { fill: #fff !important; font-weight: 600; }
[data-embed] .w-i0 .current .dot { fill: var(--w-current); }
[data-embed] .w-i0 .current .title text { fill: var(--w-current); }
[data-embed] .w-i0 .box { fill: var(--w-box); stroke: var(--border-color); }
[data-embed] .w-i0 .current .box { stroke: var(--w-current); stroke-width: 1.5px; }
[data-embed] .w-i0 .thread { stroke: var(--w-thread); }
[data-embed] .w-i0 .ahead { stroke-opacity: .35; }
</style>
<script>
(() => {
  const root = document.currentScript.closest('[data-embed]');
  const box = root.querySelector('.w-i0');
  const svgEl = box.querySelector('svg');
  const uid = 'w-i0-' + Math.random().toString(36).slice(2, 8);

  // Rich SVG text with wrapping. Markup: **bold**, *italic*, _{sub}, ^{sup}, !{overline}, \n = line break.
  const ctx = document.createElement('canvas').getContext('2d');
  const family = () => getComputedStyle(svgEl).fontFamily || 'sans-serif';
  function parse(str, bold) {
    const out = []; let b = !!bold, i = false, buf = '', k = 0;
    const push = (t, s = 0, o = false) => { if (t) out.push({ t, b, i, s, o }); };
    while (k < str.length) {
      if (str.startsWith('**', k)) { push(buf); buf = ''; b = !b; k += 2; }
      else if (str[k] === '*') { push(buf); buf = ''; i = !i; k++; }
      else if (str[k] === '!' && str[k + 1] === '{') { push(buf); buf = ''; const end = str.indexOf('}', k); push(str.slice(k + 2, end), 0, true); k = end + 1; }
      else if ((str[k] === '_' || str[k] === '^') && str[k + 1] === '{') {
        push(buf); buf = ''; const end = str.indexOf('}', k);
        push(str.slice(k + 2, end), str[k] === '_' ? 1 : -1); k = end + 1;
      } else { buf += str[k]; k++; }
    }
    push(buf); return out;
  }
  const fontOf = (r, size) => `${r.i ? 'italic ' : ''}${r.b ? 600 : 400} ${r.s ? size * 0.72 : size}px ${family()}`;
  const measure = (r, size) => { ctx.font = fontOf(r, size); return ctx.measureText(r.t).width; };
  function words(str, size, bold) {
    const ws = [[]];
    // A word may also break after a hyphen, a dash or a slash; the pieces are glued (no space).
    for (const r of parse(str, bold)) r.t.split(' ').forEach((p, j) => {
      if (j) ws.push([]);
      p.split(/(?<=[-–\/])(?=.)/).forEach((q, k) => { if (k) { ws.push([]); ws.at(-1).glue = true; } if (q) ws.at(-1).push({ ...r, t: q }); });
    });
    return ws.filter(w => w.length).map(runs => {
      let width = 0;
      runs.forEach((r, j) => {
        r.w = measure(r, size);
        const prev = runs[j - 1];
        if (r.s === -1 && prev && prev.s === 1) { r.dx = -prev.w; width += Math.max(0, r.w - prev.w); r.after = Math.max(0, prev.w - r.w); }
        else width += r.w;
      });
      return { runs, width, glue: !!runs.glue };
    });
  }
  function layout(str, maxW, size, bold) {
    const lines = [];
    for (const para of String(str).split('\n')) {
      let line = null;
      const space = measure({ t: ' ', b: false, i: false, s: 0 }, size);
      // Glued pieces (a word split after a hyphen) break apart only when the whole word cannot fit on a line.
      const chains = [];
      for (const w of words(para, size, bold)) { if (w.glue && chains.length) chains.at(-1).push(w); else chains.push([w]); }
      const add = w => {
        const sp = w.glue ? 0 : space;
        if (line && line.width + sp + w.width <= maxW) { line.words.push(w); line.width += sp + w.width; }
        else { line = { words: [w], width: w.width }; lines.push(line); }
      };
      for (const chain of chains) {
        const cw = d3.sum(chain, w => w.width);
        if (chain.length > 1 && cw <= maxW && line && line.width + space + cw > maxW) line = null;
        if (chain.length > 1 && cw <= maxW) {
          if (line) { line.words.push(...chain); line.width += space + cw; } else { line = { words: chain, width: cw }; lines.push(line); }
        } else chain.forEach(add);
      }
    }
    return { lines, width: d3.max(lines, l => l.width) || 0 };
  }
  function draw(parent, str, { x, y, w = 1e4, size = 13, lh = size * 1.28, anchor = 'start', bold = false, fill = null, cls = '' }) {
    const lay = layout(str, w, size, bold);
    lay.lines.forEach((line, n) => {
      const x0 = anchor === 'middle' ? x - line.width / 2 : anchor === 'end' ? x - line.width : x;
      const text = parent.append('text').attr('x', x0).attr('y', y + n * lh + size * 0.9).attr('class', cls).style('font-size', size + 'px');
      if (fill) text.style('fill', fill);
      let cur = 0, pending = 0; const bars = [];
      line.words.forEach((word, j) => {
        word.runs.forEach((r, m) => {
          const target = r.s === 1 ? size * 0.24 : r.s === -1 ? -size * 0.4 : 0;
          const t = text.append('tspan').text((j && !m && !word.glue ? ' ' : '') + r.t).attr('dy', target - cur);
          cur = target;
          if (r.b) t.style('font-weight', 600); if (r.i) t.style('font-style', 'italic');
          if (r.s) t.style('font-size', size * 0.72 + 'px');
          if (r.o) bars.push([t.node(), size]);
          if (r.dx) t.attr('dx', r.dx); else if (pending) t.attr('dx', pending);
          pending = r.after || 0;
        });
      });
      for (const [node, sz] of bars) {
        try {
          const k = node.getNumberOfChars() - 1, a = node.getStartPositionOfChar(k), b = node.getEndPositionOfChar(k);
          parent.append('line').attr('x1', a.x + sz * 0.12).attr('x2', b.x + sz * 0.08).attr('y1', a.y - sz * 0.8).attr('y2', a.y - sz * 0.8)
            .style('stroke', 'var(--ink)').attr('stroke-width', 0.9);
        } catch { /* not rendered yet */ }
      }
    });
    return { height: lay.lines.length ? (lay.lines.length - 1) * lh + size * 1.2 : 0, width: lay.width };
  }

  let data = null, current = null, linkBase = '';
  // In the article each station jumps to its heading; on any other page it opens the article there.
  const href = id => document.getElementById(id) ? `#${id}` : `${linkBase}attribution/#${id}`;

  function boxContent(parent, b, x, y, w, sizes, long) {
    let h = 0;
    h += draw(parent, `**${b.title}**`, { x, y, w, size: sizes[0] }).height;
    if (b.note) h += 2 + draw(parent, b.note, { x, y: y + h + 2, w, size: sizes[1], cls: 'muted' }).height;
    h += 4 + draw(parent, b.text || (long ? b.long : b.short), { x, y: y + h + 4, w, size: sizes[1] }).height;
    return h;
  }
  function measureBox(b, w, sizes, long) {
    const g = d3.select(svgEl).append('g').attr('visibility', 'hidden');
    const h = boxContent(g, b, 0, 0, w, sizes, long); g.remove(); return h;
  }

  function render() {
    if (!data) return;
    const W = svgEl.clientWidth || 400, wide = W >= 600;
    const svg = d3.select(svgEl); svg.selectAll('*').remove();
    svg.append('defs').append('marker').attr('id', uid + '-arrow').attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5)
      .attr('markerWidth', 9).attr('markerHeight', 9).attr('markerUnits', 'userSpaceOnUse').attr('orient', 'auto')
      .append('path').attr('d', 'M0,0 L10,5 L0,10 L2.5,5 z').style('fill', 'var(--w-thread)');
    const st = data.stations, pad = 5, r = wide ? 10 : 11;
    const startData = { ...data.start }, endData = { ...data.end };
    const cur = current;
    const startLink = svg.append('a').attr('href', href(data.start.id)).attr('aria-label', 'Introduction').classed('current', cur === 0);
    const endG = svg.append('g');
    let H, threadPath, cxy = [];
    if (wide) {
      const bw = Math.round(Math.max(84, Math.min(104, W * 0.122))), sizes = [12, 11], inner = bw - 12;
      const sh = measureBox(startData, inner, sizes, false) + 14, eh = measureBox(endData, inner, sizes, false) + 14;
      const x0 = bw + 4, x1 = W - bw - 14, TS = 12, AS = 11;
      // Column widths: each station gets its widest unbreakable word, then an equal share of the rest.
      const widest = (str, size, bold) => d3.max(str.split(' '), w => layout(bold ? `**${w}**` : w, 1e4, size).width);
      const need = st.map(s => Math.max(widest(s.short, TS, true), widest(s.anchors, AS, false)) + 4);
      const extra = (x1 - x0) - d3.sum(need);
      const cws = extra > 0 ? need.map(n => n + extra / st.length) : need.map(n => n * (x1 - x0) / d3.sum(need));
      box.dataset.fit = extra > 0 ? 'words' : 'squeezed';
      const lefts = cws.map((_, i) => x0 + d3.sum(cws.slice(0, i)));
      const titles = st.map((s, i) => layout(`**${s.short}**`, cws[i] - 4, TS)), anchors = st.map((s, i) => layout(s.anchors, cws[i] - 4, AS));
      const tH = d3.max(titles, l => l.lines.length) * TS * 1.28, aH = d3.max(anchors, l => l.lines.length) * AS * 1.28;
      const ty = Math.max(pad + tH + r + 6, pad + sh / 2, pad + eh / 2);
      H = Math.max(ty + r + 8 + aH + pad, ty + sh / 2 + pad, ty + eh / 2 + pad);
      // Start and end boxes, centred on the thread.
      startLink.append('rect').attr('class', 'box').attr('x', 0.5).attr('y', ty - sh / 2).attr('width', bw).attr('height', sh).attr('rx', 5);
      boxContent(startLink, startData, 6.5, ty - sh / 2 + 7, inner, sizes, false);
      endG.append('rect').attr('class', 'box').attr('x', W - bw - 0.5).attr('y', ty - eh / 2).attr('width', bw).attr('height', eh).attr('rx', 5);
      boxContent(endG, endData, W - bw + 5.5, ty - eh / 2 + 7, inner, sizes, false);
      cxy = st.map((_, i) => [lefts[i] + cws[i] / 2, ty]);
      threadPath = { from: [bw + 0.5, ty], to: [W - bw - 2, ty] };
      st.forEach((s, i) => {
        const a = svg.append('a').attr('class', 'station').attr('href', href(s.id)).attr('aria-label', `Section ${s.n}: ${s.title}. ${s.anchors.replace(/\*|\^\{|\}/g, '')}`).classed('current', cur === s.n);
        const cw = cws[i];
        a.append('rect').attr('class', 'hit').attr('x', cxy[i][0] - cw / 2 + 1).attr('y', pad - 3).attr('width', cw - 2).attr('height', H - 2 * pad + 6).attr('rx', 6);
        const tl = titles[i].lines.length * TS * 1.28;
        draw(a.append('g').attr('class', 'title'), `**${s.short}**`, { x: cxy[i][0], y: ty - r - 6 - tl, w: cw - 4, size: TS, anchor: 'middle' });
        draw(a.append('g').attr('class', 'muted'), s.anchors, { x: cxy[i][0], y: ty + r + 7, w: cw - 4, size: AS, anchor: 'middle' });
        a.append('circle').attr('class', 'dot').attr('cx', cxy[i][0]).attr('cy', ty).attr('r', r);
        a.append('text').attr('class', 'num').attr('x', cxy[i][0]).attr('y', ty).attr('dy', '0.35em').attr('text-anchor', 'middle').style('font-size', '12px').text(s.n);
      });
    } else {
      const sizes = [14, 13], tx = 2 * r + 12, inner = W - 18;
      const sh = measureBox(startData, inner, sizes, true) + 16;
      startLink.append('rect').attr('class', 'box').attr('x', 0.5).attr('y', 0.5).attr('width', W - 1).attr('height', sh).attr('rx', 5);
      boxContent(startLink, startData, 9, 8.5, inner, sizes, true);
      let y = sh + 22;
      st.forEach((s, i) => {
        const a = svg.append('a').attr('class', 'station').attr('href', href(s.id)).attr('aria-label', `Section ${s.n}: ${s.title}. ${s.anchors.replace(/\*|\^\{|\}/g, '')}`).classed('current', cur === s.n);
        const hit = a.append('rect').attr('class', 'hit').attr('x', 0).attr('y', y - 6).attr('width', W).attr('rx', 6);
        const h1 = draw(a.append('g').attr('class', 'title'), `**${s.title}**`, { x: tx, y, w: W - tx - 4, size: 14 }).height;
        const h2 = draw(a.append('g').attr('class', 'muted'), s.anchors, { x: tx, y: y + h1 + 2, w: W - tx - 4, size: 13 }).height;
        const cy = y + 14 * 0.55;
        cxy.push([r + 2, cy]);
        a.append('circle').attr('class', 'dot').attr('cx', r + 2).attr('cy', cy).attr('r', r);
        a.append('text').attr('class', 'num').attr('x', r + 2).attr('y', cy).attr('dy', '0.35em').attr('text-anchor', 'middle').style('font-size', '13px').text(s.n);
        const rowH = h1 + 2 + h2;
        hit.attr('height', rowH + 12);
        y += rowH + 18;
      });
      const endY = y + 14;
      const eh = measureBox(endData, inner, sizes, true) + 16;
      endG.append('rect').attr('class', 'box').attr('x', 0.5).attr('y', endY).attr('width', W - 1).attr('height', eh).attr('rx', 5);
      boxContent(endG, endData, 9, endY + 8, inner, sizes, true);
      threadPath = { from: [r + 2, sh + 0.5], to: [r + 2, endY - 2] };
      H = endY + eh + 1;
    }
    // The thread: solid up to the station being read, lighter beyond it.
    const tg = svg.insert('g', ':first-child').attr('class', 'thread-g');
    const last = cxy.at(-1);
    const split = cur === null ? null : cur === 0 ? threadPath.from : cxy[cur - 1];
    const seg = (a, b, cls, arrow) => { const l = tg.append('line').attr('class', 'thread ' + cls).attr('x1', a[0]).attr('y1', a[1]).attr('x2', b[0]).attr('y2', b[1]).attr('stroke-width', 2.5); if (arrow) l.attr('marker-end', `url(#${uid}-arrow)`); };
    if (split) { seg(threadPath.from, split, ''); seg(split, last, 'ahead'); seg(last, threadPath.to, 'ahead', true); }
    else { seg(threadPath.from, last, ''); seg(last, threadPath.to, '', true); }
    svg.attr('viewBox', `0 0 ${W} ${Math.ceil(H)}`).attr('height', Math.ceil(H));
  }

  function setCurrent(n) {
    if (n === current) return;
    // Redraw, keeping keyboard focus on the same station.
    const focused = box.contains(document.activeElement) ? document.activeElement.getAttribute('href') : null;
    current = n; render(); box.dataset.current = n === null ? '' : n;
    if (focused) { const el = [...svgEl.querySelectorAll('a')].find(a => a.getAttribute('href') === focused); if (el) el.focus({ preventScroll: true }); }
  }
  // Highlight the section being read when the stations' headings are on this page.
  function track() {
    const ids = [data.start.id, ...data.stations.map(s => s.id)];
    if (!ids.some(id => document.getElementById(id))) return;
    let pending = false;
    const update = () => {
      pending = false; let n = null;
      ids.forEach((id, i) => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < innerHeight * 0.35) n = i; });
      setCurrent(n);
    };
    addEventListener('scroll', () => { if (!pending) { pending = true; requestAnimationFrame(update); } }, { passive: true });
    update();
  }
  box.addEventListener('route-current', e => setCurrent(e.detail));

  linkBase = root.dataset.url.replace(/data\/[^/]*$/, '');
  d3.json(root.dataset.url).then(d => {
    data = d;
    new ResizeObserver(() => render()).observe(svgEl);
    render(); track(); box.dataset.ready = 'true';
  }).catch(error => { box.textContent = `Could not load figure: ${error.message}`; });
})();
</script>
