<div class="w-i1s">
<svg class="sketch" role="group" aria-label="Sketch of the attribution identity: realised P&L minus reference P&L equals the sum of the components plus a residual, drawn as a waterfall from the reference P&L to the realised P&L with the residual kept as its own bar. A speech bubble says: the amounts add up; this does not show that they explain the P&L. Four choices fix what the components mean: the reference, the interval, the information and the kind of indicator. Each choice links to its subsection."></svg>
</div>
<style>
[data-embed] .w-i1s { padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--page-bg); color: var(--text-color);
  --hand: "Patrick Hand", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
  --sk-ink: var(--text-color); --sk-line: color-mix(in srgb, var(--text-color) 55%, var(--page-bg));
  --sk-teal: var(--info-color); --sk-orange: color-mix(in srgb, var(--primary-color) 88%, black); --sk-green: var(--success-color);
  --sk-total: color-mix(in srgb, var(--text-color) 55%, var(--page-bg)); --sk-mark: color-mix(in srgb, var(--primary-color) 26%, var(--page-bg)); }
[data-theme="dark"] [data-embed] .w-i1s { --sk-teal: color-mix(in srgb, var(--info-color) 72%, white); --sk-orange: color-mix(in srgb, var(--primary-color) 80%, white);
  --sk-green: color-mix(in srgb, var(--success-color) 72%, white); --sk-mark: color-mix(in srgb, var(--primary-color) 30%, var(--page-bg)); }
[data-embed] .w-i1s svg { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--hand); }
[data-embed] .w-i1s svg text { font-family: var(--hand); fill: var(--sk-ink); white-space: pre; }
[data-embed] .w-i1s .muted text { fill: var(--muted-color); }
[data-embed] .w-i1s .teal text { fill: var(--sk-teal); } [data-embed] .w-i1s .orange text { fill: var(--sk-orange); } [data-embed] .w-i1s .green text { fill: var(--sk-green); }
[data-embed] .w-i1s a { cursor: pointer; } [data-embed] .w-i1s a:focus { outline: none; }
[data-embed] .w-i1s a.ptr text { fill: var(--link-color, var(--sk-teal)); }
[data-embed] .w-i1s a:hover text, [data-embed] .w-i1s a:focus-visible text { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
[data-embed] .w-i1s a:focus-visible .hit { stroke: var(--sk-teal); stroke-width: 1.5px; stroke-dasharray: 3 3; }
[data-embed] .w-i1s .hit { fill: transparent; }
[data-embed] .w-i1s .msg { margin: 0; font-size: 14px; color: var(--muted-color); }
[data-embed] .w-i1s .part, [data-embed] .w-i1s .card { transition: opacity .15s; }
[data-embed] .w-i1s svg.focus .part:not(.on) { opacity: .28; }
[data-embed] .w-i1s svg.focus .card:not(.on) { opacity: .55; }
[data-embed] .w-i1s .accent { display: none; pointer-events: none; }
[data-embed] .w-i1s .on > .accent { display: inline; }
[data-embed] .w-i1s .part.on text { fill: var(--sk-orange); }
[data-embed] .w-i1s .card { cursor: pointer; }
[data-embed] .w-i1s .diff.on > g:first-child path { stroke: var(--sk-orange) !important; }
</style>
<script>
(() => {
  const root = document.currentScript.closest('[data-embed]');
  const box = root.querySelector('.w-i1s');
  const svgEl = box.querySelector('svg');

  // Rich SVG text with wrapping. Markup: **bold**, *italic*, _{sub}, ^{sup}, !{overline}, \n = line break.
  const ctx = document.createElement('canvas').getContext('2d');
  const family = () => getComputedStyle(svgEl).fontFamily || 'cursive';
  function parse(str, bold) {
    const out = []; let b = !!bold, i = false, buf = '', k = 0;
    const push = (t, s = 0, o = false) => { if (t) out.push({ t, b, i, s, o }); };
    while (k < str.length) {
      if (str.startsWith('**', k)) { push(buf); buf = ''; b = !b; k += 2; }
      else if (str[k] === '*') { push(buf); buf = ''; i = !i; k++; }
      else if (str[k] === '!' && str[k + 1] === '{') { push(buf); buf = ''; const end = str.indexOf('}', k); push(str.slice(k + 2, end), 0, true); k = end + 1; }
      else if ((str[k] === '_' || str[k] === '^') && str[k + 1] === '{') {
        push(buf); buf = ''; const end = str.indexOf('}', k);
        push(str.slice(k + 2, end), str[k] === '_' ? 1 : -1); k = end + 1;
      } else { buf += str[k]; k++; }
    }
    push(buf); return out;
  }
  const fontOf = (r, size) => `${r.i ? 'italic ' : ''}${r.b ? 600 : 400} ${r.s ? size * 0.72 : size}px ${family()}`;
  const measure = (r, size) => { ctx.font = fontOf(r, size); return ctx.measureText(r.t).width; };
  function words(str, size, bold) {
    const ws = [[]];
    // A word may also break after a hyphen, a dash or a slash; the pieces are glued (no space).
    for (const r of parse(str, bold)) r.t.split(' ').forEach((p, j) => {
      if (j) ws.push([]);
      p.split(/(?<=[-–\/])(?=.)/).forEach((q, k) => { if (k) { ws.push([]); ws.at(-1).glue = true; } if (q) ws.at(-1).push({ ...r, t: q }); });
    });
    return ws.filter(w => w.length).map(runs => {
      let width = 0;
      runs.forEach((r, j) => {
        r.w = measure(r, size);
        const prev = runs[j - 1];
        if (r.s === -1 && prev && prev.s === 1) { r.dx = -prev.w; width += Math.max(0, r.w - prev.w); r.after = Math.max(0, prev.w - r.w); }
        else width += r.w;
      });
      return { runs, width, glue: !!runs.glue };
    });
  }
  function layout(str, maxW, size, bold) {
    const lines = [];
    for (const para of String(str).split('\n')) {
      let line = null;
      const space = measure({ t: ' ', b: false, i: false, s: 0 }, size);
      // Glued pieces (a word split after a hyphen) break apart only when the whole word cannot fit on a line.
      const chains = [];
      for (const w of words(para, size, bold)) { if (w.glue && chains.length) chains.at(-1).push(w); else chains.push([w]); }
      const add = w => {
        const sp = w.glue ? 0 : space;
        if (line && line.width + sp + w.width <= maxW) { line.words.push(w); line.width += sp + w.width; }
        else { line = { words: [w], width: w.width }; lines.push(line); }
      };
      for (const chain of chains) {
        const cw = d3.sum(chain, w => w.width);
        if (chain.length > 1 && cw <= maxW && line && line.width + space + cw > maxW) line = null;
        if (chain.length > 1 && cw <= maxW) {
          if (line) { line.words.push(...chain); line.width += space + cw; } else { line = { words: chain, width: cw }; lines.push(line); }
        } else chain.forEach(add);
      }
    }
    return { lines, width: d3.max(lines, l => l.width) || 0 };
  }
  function draw(parent, str, { x, y, w = 1e4, size = 13, lh = size * 1.28, anchor = 'start', bold = false, fill = null, cls = '' }) {
    const lay = layout(str, w, size, bold);
    lay.lines.forEach((line, n) => {
      const x0 = anchor === 'middle' ? x - line.width / 2 : anchor === 'end' ? x - line.width : x;
      const text = parent.append('text').attr('x', x0).attr('y', y + n * lh + size * 0.9).attr('class', cls).style('font-size', size + 'px');
      if (fill) text.style('fill', fill);
      let cur = 0, pending = 0; const bars = [];
      line.words.forEach((word, j) => {
        word.runs.forEach((r, m) => {
          const target = r.s === 1 ? size * 0.24 : r.s === -1 ? -size * 0.4 : 0;
          const t = text.append('tspan').text((j && !m && !word.glue ? ' ' : '') + r.t).attr('dy', target - cur);
          cur = target;
          if (r.b) t.style('font-weight', 600); if (r.i) t.style('font-style', 'italic');
          if (r.s) t.style('font-size', size * 0.72 + 'px');
          if (r.o) bars.push([t.node(), size]);
          if (r.dx) t.attr('dx', r.dx); else if (pending) t.attr('dx', pending);
          pending = r.after || 0;
        });
      });
      for (const [node, sz] of bars) {
        try {
          const k = node.getNumberOfChars() - 1, a = node.getStartPositionOfChar(k), b = node.getEndPositionOfChar(k);
          parent.append('line').attr('x1', a.x + sz * 0.12).attr('x2', b.x + sz * 0.08).attr('y1', a.y - sz * 0.8).attr('y2', a.y - sz * 0.8)
            .style('stroke', 'var(--sk-ink)').attr('stroke-width', 0.9);
        } catch { /* not rendered yet */ }
      }
    });
    return { height: lay.lines.length ? (lay.lines.length - 1) * lh + size * 1.2 : 0, width: lay.width };
  }

  // Hand-drawn strokes. rough.js writes colours as attributes, where var() is ignored; move them to
  // inline styles so the page tokens, and the light/dark switch, apply. A fixed seed per shape keeps
  // the same wobble across redraws.
  let rc = null;
  const seedOf = s => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 2147483647; return h || 1; };
  function R(parent, kind, key, ...args) {
    const opts = { seed: seedOf(key), roughness: 1.1, bowing: 1, strokeWidth: 1.4, stroke: 'var(--sk-ink)', hachureGap: 4.5, fillWeight: 1.1, ...args.pop() };
    const node = rc[kind](...args, opts);
    for (const p of node.querySelectorAll('path')) for (const a of ['stroke', 'fill']) {
      const v = p.getAttribute(a);
      if (v && v.startsWith('var(')) { p.style[a] = v; p.removeAttribute(a); }
    }
    parent.node().appendChild(node);
    return node;
  }
  function arrow(g, key, pts, color = 'var(--sk-ink)') {
    R(g, 'curve', key, pts, { stroke: color, strokeWidth: 1.6, roughness: 0.8 });
    const [a, b] = pts.slice(-2), t = Math.atan2(b[1] - a[1], b[0] - a[0]), l = 10;
    for (const s of [-1, 1]) R(g, 'line', key + s, b[0], b[1], b[0] - l * Math.cos(t + s * 0.45), b[1] - l * Math.sin(t + s * 0.45), { stroke: color, strokeWidth: 1.6, roughness: 0.6 });
  }

  // Simple drawn icons in a 40 × 40 box (the pair for the kind of indicator is twice as wide).
  function icon(g, kind, x, y, accent) {
    const c = (a, b) => [x + a, y + b], fill = `var(--sk-${accent})`, o = { roughness: 0.9, strokeWidth: 1.4 };
    const tint = { ...o, fill, fillStyle: 'hachure', hachureGap: 3.5 };
    if (kind === 'ledger') {
      R(g, 'rectangle', 'l1', ...c(7, 3), 27, 34, tint);
      R(g, 'line', 'l2', ...c(12, 3), ...c(12, 37), o);
      for (let i = 0; i < 4; i++) R(g, 'line', 'l3' + i, ...c(16, 10 + i * 6.5), ...c(30, 10 + i * 6.5), { ...o, strokeWidth: 1.6 });
    } else if (kind === 'clock') {
      R(g, 'circle', 'k1', ...c(20, 20), 34, tint);
      R(g, 'line', 'k2', ...c(20, 20), ...c(20, 8), { ...o, strokeWidth: 2 });
      R(g, 'line', 'k3', ...c(20, 20), ...c(29, 24), { ...o, strokeWidth: 2 });
    } else if (kind === 'eye') {
      R(g, 'path', 'e1', `M${c(2, 20)} Q${c(20, 3)} ${c(38, 20)} Q${c(20, 37)} ${c(2, 20)} Z`, o);
      R(g, 'circle', 'e2', ...c(20, 20), 18, tint);
      R(g, 'circle', 'e3', ...c(20, 20), 7, { ...o, fill: 'var(--sk-ink)', fillStyle: 'solid' });
    } else {
      // Steering wheel: a signal drives trades.
      R(g, 'circle', 'w1', ...c(20, 20), 34, o);
      R(g, 'circle', 'w2', ...c(20, 20), 9, { ...o, fill: 'var(--sk-teal)', fillStyle: 'solid' });
      for (const [a, b] of [[[15.5, 20], [3.5, 20]], [[24.5, 20], [36.5, 20]], [[20, 24.5], [20, 36.5]]]) R(g, 'line', 'w3' + a, ...c(...a), ...c(...b), { ...o, strokeWidth: 2 });
      // Thermometer: a state indicator describes conditions.
      const t = (a, b) => c(a + 38, b);
      R(g, 'path', 't1', `M${t(15, 26)} V${t(15, 8)[1]} Q${t(15, 3)} ${t(20, 3)} Q${t(25, 3)} ${t(25, 8)} V${t(25, 26)[1]}`, o);
      R(g, 'circle', 't2', ...t(20, 31), 13, { ...o, fill: 'var(--sk-orange)', fillStyle: 'solid' });
      R(g, 'line', 't3', ...t(20, 27), ...t(20, 12), { ...o, stroke: 'var(--sk-orange)', strokeWidth: 3 });
      for (let i = 0; i < 3; i++) R(g, 'line', 't4' + i, ...t(25, 9 + i * 5), ...t(29, 9 + i * 5), { ...o, strokeWidth: 1 });
    }
  }
  const iconW = kind => kind === 'wheel-thermometer' ? 78 : 40;

  let data = null, linkBase = '', active = null, lastWidth = 0;
  const part = (g, key) => g.append('g').attr('class', key === 'diff' ? 'part diff' : 'part').attr('data-key', key);
  function outline(g, key, x, y, w, h) {
    d3.select(R(g, 'rectangle', 'accent-' + key, x, y, w, h,
      { stroke: 'var(--sk-orange)', strokeWidth: 2.2, roughness: .8 })).attr('class', 'accent');
  }
  function frame(g, key) {
    const b = g.node().getBBox(); outline(g, key, b.x - 3, b.y - 3, b.width + 6, b.height + 6);
  }
  function labelSlot(g, b, opts, rest = b.label) {
    const lab = g.append('g').attr('class', 'lab');
    draw(lab.append('g').attr('class', 'rest muted'), rest, opts);
    let h = layout(rest, opts.w, opts.size).lines.length * opts.size * 1.28;
    for (const [key, text] of Object.entries(b.focus || {})) {
      draw(lab.append('g').attr('class', 'alt').attr('data-choice', key).attr('display', 'none'), text, opts);
      h = Math.max(h, layout(text, opts.w, opts.size).lines.length * opts.size * 1.28);
    }
    return h;
  }
  function paint() {
    const c = data.choices.find(c => c.key === active);
    const svg = d3.select(svgEl).classed('focus', !!c);
    svg.selectAll('.part').classed('on', function () { return !!c && c.on.includes(this.dataset.key); });
    svg.selectAll('.card').classed('on', function () { return !!c && c.key === this.dataset.key; });
    svg.selectAll('.lab').each(function () {
      const alt = c && this.querySelector(`.alt[data-choice="${c.key}"]`);
      d3.select(this).selectAll('.alt').attr('display', function () { return this === alt ? null : 'none'; });
      d3.select(this).select('.rest').attr('display', alt ? 'none' : null);
    });
    svg.selectAll('.detail-state').attr('display', function () { return this.dataset.choice === (active || '') ? null : 'none'; });
    box.dataset.active = active || '';
  }
  function setActive(key) { if (key !== active) { active = key; paint(); } }
  // As in A: a tap on a card selects it; a tap elsewhere clears it. Links still navigate.
  document.addEventListener('click', e => { if (!box.contains(e.target) || !e.target.closest('.card')) setActive(null); });
  const href = id => document.getElementById(id) ? `#${id}` : `${linkBase}attribution/#${id}`;
  const plain = s => s.replace(/\*|_\{|\^\{|\}/g, '');
  const accents = { reference: 'teal', interval: 'orange', information: 'green', indicator: 'teal' };

  function steps() {
    let run = 0;
    return data.bars.map(b => {
      const from = b.kind === 'step' || b.kind === 'residual' ? run : 0;
      if (b.kind === 'start') run = b.value; else if (b.kind !== 'end') run += b.value;
      return { ...b, from, to: run, lo: Math.min(from, run), hi: Math.max(from, run) };
    });
  }
  const barStyle = b => b.kind === 'step' ? { fill: 'var(--sk-teal)', fillStyle: 'hachure' }
    : b.kind === 'residual' ? { fill: 'var(--sk-line)', fillStyle: 'cross-hatch', hachureGap: 4, strokeLineDash: [5, 4] }
    : { fill: 'var(--sk-total)', fillStyle: 'hachure', hachureAngle: 60 };

  // The identity, lettered large over a marker stroke, with each term's name under it.
  function formula(g, y0, W, wide) {
    const fs = wide ? 30 : 25, ls = wide ? 15 : 14, gap = wide ? 12 : 6;
    const terms = data.identity.filter(t => t.key), ops = data.identity.filter(t => t.op);
    const opW = ops.map(t => layout(t.op, 1e4, fs).width + 2 * gap);
    const need = terms.map(t => Math.max(layout(t.sym, 1e4, fs).width, layout(t.label, 1e4, ls).width) + 8);
    const room = W - d3.sum(opW);
    const colW = d3.sum(need) <= room ? need : terms.map(t => Math.max(layout(t.sym, 1e4, fs).width + 4, room / terms.length));
    const total = d3.sum(opW) + d3.sum(colW);
    let x = (W - total) / 2, k = 0, o = 0, lab = 0;
    const top = y0 + 8;
    R(g, 'rectangle', 'mark', x - 6, top + fs * 0.12, total + 12, fs * 0.98, { stroke: 'none', fill: 'var(--sk-mark)', fillStyle: 'hachure', hachureGap: 3, fillWeight: 3, hachureAngle: -20, roughness: 1.6 });
    for (const t of data.identity) {
      if (t.op) { const w = opW[o++]; draw(g, t.op, { x: x + w / 2, y: top, size: fs, anchor: 'middle' }); x += w; continue; }
      const w = colW[k++], tg = part(g, t.key);
      draw(tg, t.sym, { x: x + w / 2, y: top, size: fs, anchor: 'middle' });
      lab = Math.max(lab, draw(tg.append('g').attr('class', 'muted'), t.label, { x: x + w / 2, y: top + fs * 1.15 + 4, w: w - 4, size: ls, anchor: 'middle' }).height);
      frame(tg, t.key);
      x += w;
    }
    return 8 + fs * 1.15 + 4 + lab;
  }

  // Wide: vertical columns; the residual gets a hand-written note, the difference a drawn brace.
  function waterfallV(g, x0, y0, Ww) {
    const bs = steps(), n = bs.length, right = 88, cw = (Ww - right) / n, bw = Math.min(46, cw * 0.62);
    const ph = 150, top = y0 + 34, ss = 17, ls = 14;
    const y = d3.scaleLinear().domain([0, d3.max(bs, b => b.hi) * 1.04]).range([top + ph, top]);
    const cx = i => x0 + cw * i + cw / 2, ref = bs[0], end = bs.at(-1), bx = cx(n - 1) + bw / 2 + 10;
    R(g, 'line', 'base', x0, y(0), x0 + cw * n, y(0), { roughness: 0.7 });
    R(g, 'line', 'guide', cx(0) + bw / 2, y(ref.to), bx, y(ref.to), { stroke: 'var(--sk-line)', strokeWidth: 1, strokeLineDash: [3, 5], roughness: 0.4 });
    bs.slice(0, -1).forEach((b, i) => R(g, 'line', 'join' + i, cx(i) + bw / 2, y(b.to), cx(i + 1) - bw / 2, y(b.to), { stroke: 'var(--sk-line)', strokeWidth: 1, strokeLineDash: [4, 4], roughness: 0.4 }));
    let lab = 0;
    bs.forEach((b, i) => {
      const bg = part(g, b.key);
      R(bg, 'rectangle', 'bar' + b.key, cx(i) - bw / 2, y(b.hi), bw, Math.max(y(b.lo) - y(b.hi), 3), barStyle(b));
      draw(bg, b.sym, { x: cx(i), y: top + ph + 6, size: ss, anchor: 'middle' });
      outline(bg, 'bar' + b.key, cx(i) - bw / 2 - 2, y(b.hi) - 2, bw + 4, Math.max(y(b.lo) - y(b.hi), 3) + 4);
      lab = Math.max(lab, labelSlot(bg, b, { x: cx(i), y: top + ph + 6 + ss * 1.15, w: cw - 4, size: ls, anchor: 'middle' }, b.kind === 'step' ? '' : b.label.split(':')[0]));
    });
    // The columns are too narrow for three labels: one brace names the components together.
    const cg = part(g, 'sum');
    const cs = bs.flatMap((b, i) => b.kind === 'step' ? [i] : []), xa = cx(cs[0]) - cw / 2 + 8, xb = cx(cs.at(-1)) + cw / 2 - 8, mid = (xa + xb) / 2, yb = top + ph + 6 + ss * 1.15 + lab + 2;
    R(cg, 'path', 'cbrace', `M${xa},${yb} q0,6 6,6 H${mid - 6} q6,0 6,6 q0,-6 6,-6 H${xb - 6} q6,0 6,-6`, { roughness: 0.6, strokeWidth: 1.3 });
    lab += 14 + draw(cg.append('g').attr('class', 'muted'), data.identity.find(t => t.key === 'sum').label, { x: mid, y: yb + 14, size: ls, anchor: 'middle' }).height;
    frame(cg, 'components');
    // "keep it visible", written above the residual with a small arrow down to it.
    const ei = bs.findIndex(b => b.kind === 'residual'), e = bs[ei], note = e.label.split(': ')[1];
    const nw = draw(g.append('g').attr('class', 'orange'), note, { x: cx(ei) - 8, y: y0, size: 15, anchor: 'middle' }).width;
    arrow(g, 'note', [[cx(ei) + nw / 2 - 18, y0 + 20], [cx(ei) + 6, y0 + 26], [cx(ei) + 2, y(e.hi) - 4]], 'var(--sk-orange)');
    // The brace spans the difference to explain.
    const y1 = y(end.to), y2 = y(ref.to), m = (y1 + y2) / 2;
    const dg = part(g, 'diff');
    R(dg, 'path', 'brace', `M${bx},${y1} q7,0 7,7 V${m - 6} q0,6 7,6 q-7,0 -7,6 V${y2 - 7} q0,7 -7,7`, { roughness: 0.6, strokeWidth: 1.5 });
    const dl = dg.append('g'), h1 = draw(dl, data.difference.sym, { x: bx + 18, y: 0, size: 16 }).height;
    draw(dl.append('g').attr('class', 'muted'), data.difference.label, { x: bx + 18, y: h1, size: 14 });
    dl.attr('transform', `translate(0,${m - (h1 + 14 * 1.2) / 2})`);
    frame(dg, 'difference');
    return { h: 34 + ph + 6 + ss * 1.15 + lab, components: mid };
  }

  // Narrow: one row per bar, labels on the left, the brace under the last row.
  function waterfallH(g, y0, W) {
    const bs = steps(), lw = Math.min(118, W * 0.37), ss = 17, ls = 14, bh = 18;
    const slot = d3.max(bs, b => d3.max([b.label, ...Object.values(b.focus || {})], t => layout(t, lw, ls).lines.length)) * ls * 1.28, rh = ss * 1.15 + slot + 10;
    const x = d3.scaleLinear().domain([0, d3.max(bs, b => b.hi) * 1.04]).range([lw + 10, W - 4]);
    const ref = bs[0], end = bs.at(-1), cy = i => y0 + i * rh + ss * 0.6, yEnd = y0 + bs.length * rh;
    R(g, 'line', 'base', x(0), y0 - 4, x(0), cy(bs.length - 1) + bh / 2 + 4, { roughness: 0.7 });
    R(g, 'line', 'guide', x(ref.to), cy(0) + bh / 2, x(ref.to), yEnd, { stroke: 'var(--sk-line)', strokeWidth: 1, strokeLineDash: [3, 5], roughness: 0.4 });
    bs.slice(0, -1).forEach((b, i) => R(g, 'line', 'join' + i, x(b.to), cy(i) + bh / 2, x(b.to), cy(i + 1) - bh / 2, { stroke: 'var(--sk-line)', strokeWidth: 1, strokeLineDash: [4, 4], roughness: 0.4 }));
    bs.forEach((b, i) => {
      const bg = part(g, b.key);
      R(bg, 'rectangle', 'bar' + b.key, x(b.lo), cy(i) - bh / 2, Math.max(x(b.hi) - x(b.lo), 3), bh, barStyle(b));
      draw(bg, b.sym, { x: 0, y: y0 + i * rh, size: ss });
      outline(bg, 'bar' + b.key, x(b.lo) - 2, cy(i) - bh / 2 - 2, Math.max(x(b.hi) - x(b.lo), 3) + 4, bh + 4);
      labelSlot(bg, b, { x: 0, y: y0 + i * rh + ss * 1.15, w: lw, size: ls });
    });
    const x1 = x(ref.to), x2 = x(end.to), m = (x1 + x2) / 2;
    const dg = part(g, 'diff');
    R(dg, 'path', 'brace', `M${x1},${yEnd} q0,7 7,7 H${m - 6} q6,0 6,7 q0,-7 6,-7 H${x2 - 7} q7,0 7,-7`, { roughness: 0.6, strokeWidth: 1.5 });
    const text = `${data.difference.sym} ${data.difference.label}`, tw = layout(text, 1e4, 16).width + 6;
    const tx = Math.min(Math.max(m, tw / 2), W - tw / 2) - tw / 2, ty = yEnd + 18;
    const w1 = draw(dg, data.difference.sym, { x: tx, y: ty, size: 16 }).width;
    draw(dg.append('g').attr('class', 'muted'), data.difference.label, { x: tx + w1 + layout(' ', 1e4, 16).width + 6, y: ty, size: 16 });
    frame(dg, 'difference');
    return ty + 16 * 1.2 - y0;
  }

  // Speech bubble with a tail toward (tx, ty); the tail leaves the left side or the top.
  function bubble(g, x, y, w, tail) {
    const p = 14, ts = 18, fs = 16, inner = w - 2 * p;
    const t1 = layout(data.caution.title.toUpperCase(), inner, ts).lines.length * ts * 1.2, t2 = layout(data.caution.text, inner, fs).lines.length * fs * 1.28;
    const h = p + t1 + 4 + t2 + p - 4, r = 14;
    const [tx, ty] = tail;
    const path = tx < x
      ? `M${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} H${x + r} Q${x},${y + h} ${x},${y + h - r} V${y + h / 2 + 10} L${tx},${ty} L${x},${y + h / 2 - 8} V${y + r} Q${x},${y} ${x + r},${y} Z`
      : `M${x + r},${y} H${tx - 8} L${tx},${ty} L${tx + 12},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} H${x + r} Q${x},${y + h} ${x},${y + h - r} V${y + r} Q${x},${y} ${x + r},${y} Z`;
    R(g, 'path', 'bubble', path, { strokeWidth: 1.6, roughness: 0.9, fill: 'var(--sk-mark)', fillStyle: 'solid' });
    draw(g.append('g').attr('class', 'orange'), data.caution.title.toUpperCase(), { x: x + p, y: y + p - 2, w: inner, size: ts, lh: ts * 1.2 });
    draw(g, data.caution.text, { x: x + p, y: y + p - 2 + t1 + 4, w: inner, size: fs });
    return h;
  }

  function cards(g, y0, W, wide) {
    const cols = wide ? 2 : 1, gap = wide ? 14 : 12, cw = (W - (cols - 1) * gap) / cols, p = 12, ts = 18, fs = 15.5, ls = 15;
    const content = (cg, c, x, y, inner) => {
      const iw = iconW(c.icon), tx = x + iw + 12, tw = inner - iw - 12, accent = accents[c.key];
      icon(cg, c.icon, x, y + 2, accent);
      const a = cg.append('a').attr('class', 'ctitle').attr('href', href(c.links[0].id)).attr('aria-label', `${c.title}, section ${c.links[0].text.slice(1)}: ${plain(c.text)}`);
      const th = draw(a.append('g').attr('class', accent), `${c.n}. ${c.title.toUpperCase()}`, { x: tx, y, w: tw, size: ts, lh: ts * 1.15 });
      a.insert('rect', ':first-child').attr('class', 'hit').attr('x', tx - 3).attr('y', y - 2).attr('width', th.width + 6).attr('height', th.height + 4).attr('rx', 4);
      let h = th.height + 3;
      h += draw(cg, c.text, { x: tx, y: y + h, w: tw, size: fs }).height + 4;
      let lx = tx, ly = y + h; const sp = 14;
      c.links.forEach((l, i) => {
        const label = (i ? '' : '→ ') + l.text, lw = layout(label, 1e4, ls).width;
        if (i && lx + lw > tx + tw) { lx = tx; ly += ls * 1.3; }
        draw(cg.append('a').attr('class', 'ptr').attr('href', href(l.id)).attr('aria-label', `Section ${plain(l.text).slice(1)}`), label, { x: lx, y: ly, size: ls });
        lx += lw + sp;
      });
      return Math.max(ly - y + ls * 1.2, 44);
    };
    const hs = data.choices.map(c => { const t = g.append('g').attr('visibility', 'hidden'); const h = content(t, c, 0, 0, cw - 2 * p); t.remove(); return h + 2 * p; });
    const rowsH = d3.range(Math.ceil(hs.length / cols)).map(k => d3.max(hs.slice(k * cols, k * cols + cols)));
    let y = y0;
    data.choices.forEach((c, i) => {
      const row = Math.floor(i / cols), col = i % cols, x = col * (cw + gap), h = wide ? rowsH[row] : hs[i];
      if (col === 0 && i) y += rowsH[row - 1] + gap;
      const cg = g.append('g').attr('class', 'card').attr('data-key', c.key);
      R(cg, 'rectangle', 'card' + c.key, x + 2, y + 2, cw - 4, h - 4, { stroke: 'var(--sk-line)', strokeWidth: 1.2, roughness: 1.3 });
      outline(cg, 'card' + c.key, x + 2, y + 2, cw - 4, h - 4);
      content(cg, c, x + p, y + p, cw - 2 * p);
      cg.insert('rect', ':first-child').attr('class', 'hit').attr('x', x).attr('y', y).attr('width', cw).attr('height', h);
      cg.on('pointerenter', e => { if (e.pointerType === 'mouse') setActive(c.key); })
        .on('pointerleave', e => { if (e.pointerType === 'mouse') setActive(null); })
        .on('focusin', () => setActive(c.key)).on('focusout', () => setActive(null))
        .on('click', e => { if (!e.target.closest('a')) setActive(c.key); });
    });
    return y + rowsH.at(-1) - y0;
  }

  function heading(g, x, y, w, size) {
    const t = draw(g, data.choicesTitle.toUpperCase(), { x, y, w, size, lh: size * 1.15 });
    R(g, 'curve', 'underline', d3.range(7).map(i => [x + i * Math.min(t.width, w) / 6, y + t.height + 3 + (i % 2 ? 2.5 : -1)]), { stroke: 'var(--sk-orange)', strokeWidth: 2, roughness: 0.6 });
    return t.height + 8;
  }

  function render() {
    if (!data) return;
    const W = svgEl.clientWidth || 400, wide = W >= 600;
    const svg = d3.select(svgEl); svg.selectAll('*').remove();
    const g = svg.append('g');
    let y = formula(g, 0, W, wide) + (wide ? 8 : 16);
    if (wide) {
      const bw = Math.min(232, W * 0.34), ww = W - bw - 26;
      const wf = waterfallV(g, 0, y, ww);
      const bh = bubble(g.append('g'), W - bw, y + 44, bw, [W - bw - 24, y + 112]);
      y += Math.max(wf.h, 44 + bh) + 26;
      const hx = 40, hh = heading(g, hx, y, W - hx, 19);
      // The choices fix what the components mean: an arrow from the heading up to them.
      arrow(g, 'fix', [[hx - 16, y + hh * 0.6], [hx - 4, y - 8], [wf.components - 8, y - 18]]);
      y += hh + 12;
      y += cards(g, y, W, wide);
    } else {
      y += waterfallH(g, y, W) + 8;
      y += bubble(g.append('g'), 8, y + 16, W - 16, [W * 0.62, y]) + 16 + 24;
      y += heading(g, 0, y, W, 18) + 12;
      y += cards(g, y, W, wide);
    }
    y += 16;
    let dh = 0;
    for (const c of [{ key: '', detail: data.idle }, ...data.choices]) {
      const dg = g.append('g').attr('class', 'detail-state').attr('data-choice', c.key);
      dh = Math.max(dh, draw(dg, c.detail, { x: 4, y, w: W - 8, size: 15.5 }).height);
    }
    y += dh;
    paint();
    svg.attr('viewBox', `0 -2 ${W} ${Math.ceil(y + 4)}`).attr('height', Math.ceil(y + 4));
  }

  // rough.js (4.6.6, MIT) and Patrick Hand (OFL) are vendored under vendor/, so the page makes no
  // remote request; several copies of this embed share one load.
  linkBase = root.dataset.url.replace(/data\/[^/]*$/, '');
  const shared = window.wI1Sketch || (window.wI1Sketch = {
    rough: window.rough ? Promise.resolve() : new Promise((ok, ko) => {
      const s = document.createElement('script'); s.src = `${linkBase}vendor/rough-4.6.6.min.js`;
      s.onload = ok; s.onerror = () => ko(new Error('rough.js did not load')); document.head.appendChild(s);
    }),
    // Without the font the sketch falls back to the next hand-lettered face in --hand.
    font: (() => { const f = new FontFace('Patrick Hand', `url(${linkBase}vendor/patrick-hand-latin-400.woff2) format("woff2")`); document.fonts.add(f); return f.load(); })().catch(() => null),
  });
  Promise.all([d3.json(root.dataset.url), shared.rough, shared.font]).then(([d]) => {
    data = d; rc = rough.svg(svgEl);
    new ResizeObserver(() => { const w = svgEl.clientWidth; if (w !== lastWidth) { lastWidth = w; render(); } }).observe(svgEl);
    render(); box.dataset.ready = 'true';
  }).catch(error => { box.insertAdjacentHTML('beforeend', `<p class="msg">Could not load figure: ${error.message}</p>`); });
})();
</script>
